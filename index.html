<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaspIA - Página Inicial</title>
<style>
:root{--c:#A3003D;--c-dk:#7d002f;--c-lt:#fbeef3;--bg:#f6f3f4;--tx:#2b2226;--mut:#6f6368;--bd:#e3d9dd}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--c);color:#fff;padding:22px 24px}
header .sistema{margin:0 0 6px;font-size:34px;font-weight:800;line-height:1;letter-spacing:.5px;color:#fff}
header .sistema span{color:#F16323}
header h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.2px}
header p{margin:4px 0 0;font-size:14px;opacity:.88}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;width:100%;max-width:980px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;text-decoration:none;color:var(--tx);background:#fff;border:2px solid var(--bd);border-radius:14px;padding:34px 22px 30px;min-height:290px;transition:background .15s,border-color .15s,color .15s,transform .15s}
.btn svg{width:112px;height:112px;flex:none}
.btn .ic-bg{fill:var(--c-lt);transition:fill .15s}
.btn .ln{stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.btn .fl{fill:var(--c);transition:fill .15s}
.btn .wh{fill:#fff;transition:fill .15s}
.btn span{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:.2px}
.btn:hover,.btn:focus-visible{background:var(--c);border-color:var(--c);color:#fff;transform:translateY(-3px)}
.btn:hover .ic-bg,.btn:focus-visible .ic-bg{fill:#ffffff26}
.btn:hover .ln,.btn:focus-visible .ln{stroke:#fff}
.btn:hover .fl,.btn:focus-visible .fl{fill:#fff}
.btn:hover .wh,.btn:focus-visible .wh{fill:var(--c)}
.btn:focus-visible{outline:3px solid var(--c-dk);outline-offset:3px}
footer{padding:14px 24px;font-size:12px;color:var(--mut);text-align:center}
@media (max-width:760px){.grid{grid-template-columns:1fr}.btn{min-height:0;flex-direction:row;justify-content:flex-start;text-align:left;padding:20px 22px;gap:18px}.btn svg{width:76px;height:76px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover,.btn:focus-visible{transform:none}}
</style>
</head>
<body>
<header>
  <div class="sistema" aria-label="MaspIA">Masp<span>IA</span></div>
  <h1>Pareceres e Licenciamento</h1>
  <p>Escolha o documento que deseja elaborar.</p>
</header>

<main>
  <nav class="grid" aria-label="Documentos">

    <a class="btn" href="Parecer_Simplificado.html">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ic-bg" cx="60" cy="60" r="56"/>
        <path class="ln" d="M38 24h31l17 17v53a4 4 0 0 1-4 4H38a4 4 0 0 1-4-4V28a4 4 0 0 1 4-4z"/>
        <path class="ln" d="M69 24v17h17"/>
        <path class="ln" d="M44 58h32M44 70h20"/>
        <circle class="fl" cx="78" cy="86" r="14"/>
        <path d="M71 86l5 5 9-10" stroke="#fff" class="chk" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>PARECER GERENCIAL SIMPLIFICADO</span>
    </a>

    <a class="btn" href="Parecer_Gerencial_Completo.html">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ic-bg" cx="60" cy="60" r="56"/>
        <path class="ln" d="M46 20h28l14 14v46a4 4 0 0 1-4 4H46a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" opacity=".55"/>
        <path class="ln" d="M38 28h28l14 14v46a4 4 0 0 1-4 4H38a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4z"/>
        <path class="ln" d="M66 28v14h14"/>
        <path class="ln" d="M42 56h30M42 66h30M42 76h30M42 86h18"/>
        <circle class="fl" cx="80" cy="88" r="14"/>
        <path d="M73 88l5 5 9-10" stroke="#fff" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>PARECER GERENCIAL COMPLETO</span>
    </a>

    <a class="btn" href="Dispensa_Licenca_Ambiental_Natal.html">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ic-bg" cx="60" cy="60" r="56"/>
        <path class="ln" d="M60 86V58"/>
        <path class="fl" d="M60 60C42 60 32 48 32 32c18 0 28 10 28 28z"/>
        <path class="fl" d="M60 70c16 0 26-10 26-26-16 0-26 10-26 26z"/>
        <path class="ln" d="M30 92h60"/>
        <path class="ln" d="M38 92V80h12v12M70 92V76h14v16"/>
        <path class="wh" d="M74 80h3v3h-3zM79 80h3v3h-3z"/>
      </svg>
      <span>DISPENSA DE LICENÇA AMBIENTAL EM NATAL-RN</span>
    </a>

  </nav>
</main>

<footer>Os dados dos pareceres ficam salvos somente neste computador.</footer>
</body>
</html>
